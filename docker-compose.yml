# Cooper SAP Invoice - Docker Compose Configuration
# Auto-restart enabled for both services

services:
  # Django Backend
  backend:
    build:
      context: "./sap-invoice-backend-main/sap-invoice-backend-main"
      dockerfile: Dockerfile
    container_name: cooper-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    env_file:
      - "./sap-invoice-backend-main/sap-invoice-backend-main/.env"
    volumes:
      - backend_static:/app/static
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cooper-network

  # React Frontend (with Nginx)
  frontend:
    build:
      context: "./cooper_frontend-main/cooper_frontend-main"
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/
    container_name: cooper-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - backend_static:/app/static:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cooper-network

networks:
  cooper-network:
    driver: bridge

volumes:
  backend_static:
  backend_logs:

